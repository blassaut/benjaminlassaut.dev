name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      unit: ${{ steps.filter.outputs.unit }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '*.config.*'
              - 'tsconfig*.json'
              - '.github/workflows/**'
            # What can change a unit test or mutation result
            unit:
              - 'src/**'
              - 'scripts/mutation-gate.ts'
              - 'stryker.config.mjs'
              - 'vite.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.unit == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # the mutation gate diffs against the base branch
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Incremental results from this branch's last run, else from main's.
      # Cache entries are immutable, hence one key per run.
      - uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref || github.ref_name }}-
            stryker-incremental-main-
      # Fails the job when the mutation score drops under `thresholds.break`
      # (stryker.config.mjs). Coverage tells us a line ran; this tells us a
      # test would actually notice if that line were wrong.
      # Pull requests only re-test mutants in changed code or tests; pushes to
      # main run everything (--force) so main's cache is always a full run.
      - run: npx stryker run --reporters clear-text,html,json ${{ github.event_name == 'push' && '--force' || '' }}
      # The break threshold guards the overall score; this guards the new code.
      # Fails when a mutant on a line this PR adds or changes is not killed
      # (unless skipped on purpose with `// Stryker disable next-line`).
      - name: Mutation gate on changed lines
        if: github.event_name == 'pull_request'
        run: node scripts/mutation-gate.ts --base origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
